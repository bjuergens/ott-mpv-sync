name: release

# Publishes to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token needed. Configure the
# trusted publisher on PyPI first: project -> Publishing -> add GitHub publisher
# (this repo + workflow `release.yml` + environment `pypi`).

on:
  release:
    types: [published]

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
