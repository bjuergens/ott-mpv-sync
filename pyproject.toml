[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ott-mpv-sync"
version = "0.1.0"
description = "Follow-only client that mirrors an OpenTogetherTube room's playback into a local mpv."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "wotaniip", email = "wotaniip@googlemail.com" }]
keywords = ["mpv", "opentogethertube", "ott", "websocket", "sync", "watch-together"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "websockets>=13",
]

[project.scripts]
ott-mpv-sync = "ott_mpv_sync.cli:main"

[project.urls]
Homepage = "https://github.com/wotaniip/ott-mpv-sync"
Repository = "https://github.com/wotaniip/ott-mpv-sync"
Issues = "https://github.com/wotaniip/ott-mpv-sync/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # don't enforce a hard line-length limit

[tool.pytest.ini_options]
testpaths = ["tests"]
